[project]
name = "SquareShiftingInterferometry"
version = "1.0.0"
description = "ModeLab square phase-shifting interferometry on the SLM"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0,<2.6",
  "matplotlib>=3.8",
  "visualization @ git+https://github.com/MarKo7s/visualization.git@v1.0.0",
]

[project.optional-dependencies]
gui = [
  "PySide6>=6.5",
  "pyqtgraph>=0.13",
]
notebooks = [
  "jupyter>=1.0",
  "ipykernel>=6.0",
]

[project.urls]
Repository = "https://github.com/MarKo7s/SquareShiftingInterferometry"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"SquareShiftingInterferometry" = "."}
packages = [
  "SquareShiftingInterferometry",
  "SquareShiftingInterferometry.ui",
]
